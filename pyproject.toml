[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chore-footage"
version = "0.1.0"
description = "Shutterstock for robot training videos: get paid to film yourself doing chores"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
chore-footage = "chore_footage.__main__:main"

[tool.setuptools]
packages = ["chore_footage"]
